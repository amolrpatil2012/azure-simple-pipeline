trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'Service Connection For Pipeline'
  webAppName: 'simple-pipeline'

stages:
- stage: Build
  displayName: 'Build and Package Spring App'
  jobs:
  - job: BuildJob
    displayName: 'Maven Compile, Test and Build'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled
    - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        javaHomeOption: JDKVersion
        jdkVersionOption: 1.17
        publishJUnitResults: true 
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'package'
    - task: CopyFiles@2
      inputs:
        contents: '**/target/*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'


- stage: Deploy
  displayName: 'Deploy To Production'
  dependsOn: Build
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Jar to Azure Web App'
    environment: 'Production'    
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(System.ArtifactsDirectory)/drop/**/*.jar'
    